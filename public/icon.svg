<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005a2b" />
      <stop offset="50%" stop-color="#004220" />
      <stop offset="100%" stop-color="#002612" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="softGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base (Emerald Dark Theme) -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border Rings -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.9"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 8" stroke-opacity="0.7"/>

  <!-- 8-Pointed Star Geometric Islamic Medallion (Khatam) -->
  <g transform="translate(256, 250) scale(1.65)">
    <rect x="-80" y="-80" width="160" height="160" rx="14" fill="#003518" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.85"/>
    <rect x="-80" y="-80" width="160" height="160" rx="14" transform="rotate(45)" fill="#003518" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.85"/>
  </g>

  <!-- Dome & Crescent Motif -->
  <g transform="translate(256, 140)">
    <path d="M -50 40 Q 0 0 50 40 Q 0 15 -50 40 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <polygon points="0,-10 5,5 20,5 8,15 12,30 0,20 -12,30 -8,15 -20,5 -5,5" fill="url(#goldGrad)" />
  </g>

  <!-- Central Emblem Typography -->
  <!-- MILAD -->
  <text
    x="256"
    y="240"
    text-anchor="middle"
    fill="url(#softGold)"
    font-size="64"
    font-weight="900"
    letter-spacing="10"
    font-family="system-ui, -apple-system, sans-serif"
    filter="url(#glow)"
  >
    MILAD
  </text>

  <!-- SIDOGIRI -->
  <text
    x="256"
    y="300"
    text-anchor="middle"
    fill="#ffffff"
    font-size="44"
    font-weight="800"
    letter-spacing="6"
    font-family="system-ui, -apple-system, sans-serif"
  >
    SIDOGIRI
  </text>

  <!-- Gold Ribbon Banner: SIE PENGANUGERAHAN -->
  <g transform="translate(0, 30)">
    <path d="M 86 330 L 426 330 L 406 374 L 106 374 Z" fill="url(#goldGrad)" />
    <path d="M 86 330 L 60 352 L 86 374 L 106 374 L 86 330 Z" fill="#92400e" />
    <path d="M 426 330 L 452 352 L 426 374 L 406 374 L 426 330 Z" fill="#92400e" />
    
    <text
      x="256"
      y="362"
      text-anchor="middle"
      fill="#16221b"
      font-size="24"
      font-weight="900"
      letter-spacing="4"
      font-family="system-ui, -apple-system, sans-serif"
    >
      SIE PENGANUGERAHAN
    </text>
  </g>
</svg>
