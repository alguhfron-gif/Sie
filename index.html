<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sie Penganugerahan - Portal Panitia & Operasional</title>

    <!-- PWA Primary Meta Tags -->
    <meta name="title" content="Sie Penganugerahan - Portal Panitia & Operasional" />
    <meta name="description" content="Aplikasi Operasional Sie Penganugerahan: Pengelolaan Nominasi, Administrasi Kegiatan, Koordinasi Panitia, dan Laporan Keuangan." />
    <meta name="theme-color" content="#8a7c4c" />
    <link rel="canonical" href="https://sie-penganugerahan.sidogiri.net/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sie-penganugerahan.sidogiri.net/" />
    <meta property="og:title" content="Sie Penganugerahan - Portal Panitia & Operasional" />
    <meta property="og:description" content="Aplikasi Operasional Sie Penganugerahan: Pengelolaan Nominasi, Administrasi Kegiatan, Koordinasi Panitia, dan Laporan Keuangan." />
    <meta property="og:image" content="/logo-milad.png" />

    <!-- Google Fonts: Sora (Milad Sidogiri Typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Web App Manifest & Favicons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo-milad.png" />
    <link rel="alternate icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo-milad.png" />

    <!-- iOS & Mobile Web App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sie Penganugerahan" />
    <!-- Pre-Mount Fallback & Self-Healing Interceptor -->
    <style>
      #app-preloader {
        min-height: 100vh;
        width: 100%;
        background-color: #efede7;
        color: #24211c;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .preloader-card {
        background: #ffffff;
        border: 1px solid rgba(138, 124, 76, 0.25);
        border-radius: 24px;
        padding: 32px 24px;
        max-width: 380px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(36, 33, 28, 0.08);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .preloader-spinner {
        width: 38px;
        height: 38px;
        border: 3.5px solid rgba(138, 124, 76, 0.2);
        border-top-color: #8a7c4c;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 16px 0;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .preloader-btn {
        background: #8a7c4c;
        color: #ffffff;
        border: none;
        padding: 10px 18px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        margin-top: 12px;
        transition: background 0.2s;
        text-decoration: none;
        display: inline-block;
      }
      .preloader-btn:hover {
        background: #6f633a;
      }
      .preloader-btn-sub {
        background: transparent;
        color: #7c7b77;
        border: 1px solid rgba(36, 33, 28, 0.15);
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-preloader">
        <div class="preloader-card">
          <img src="/logo-milad.png" alt="Logo Milad Sidogiri" style="width: 64px; height: 64px; object-fit: contain; margin-bottom: 8px;" onerror="this.style.display='none'" />
          <h2 style="font-size: 15px; font-weight: 800; margin: 4px 0 2px 0; letter-spacing: -0.3px; color: #24211c;">
            SIE PENGANUGERAHAN
          </h2>
          <p style="font-size: 11px; font-weight: 700; color: #8a7c4c; margin: 0 0 12px 0;">
            MILAD SIDOGIRI 2026
          </p>
          <div class="preloader-spinner"></div>
          <p id="preloader-status" style="font-size: 11.5px; color: #64748b; margin: 0; line-height: 1.4;">
            Memuat portal operasional panitia...
          </p>

          <!-- Automatic Recovery Actions (visible if loading takes > 4s) -->
          <div id="preloader-actions" style="display: none; margin-top: 14px; width: 100%;">
            <p style="font-size: 10.5px; color: #94a3b8; margin-bottom: 8px;">
              Jika tampilan terhenti, ketuk tombol di bawah:
            </p>
            <button class="preloader-btn" onclick="window.location.reload(true)" style="width: 100%;">
              Muat Ulang Halaman
            </button>
            <button class="preloader-btn preloader-btn-sub" onclick="clearAppDataAndReload()" style="width: 100%;">
              Bersihkan Cache & Buka Baru
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Global error interceptor for mobile PWA standalone launch
      window.addEventListener('error', function(e) {
        var actions = document.getElementById('preloader-actions');
        if (actions) actions.style.display = 'block';
        var status = document.getElementById('preloader-status');
        if (status) {
          status.innerHTML = '<span style="color:#e11d48;font-weight:700;">Menyiapkan penyelarasan versi modul di HP...</span>';
        }
      });

      // Show fallback reload buttons if React takes longer than 3.5 seconds to mount
      setTimeout(() => {
        const actions = document.getElementById('preloader-actions');
        if (actions) actions.style.display = 'block';
        const status = document.getElementById('preloader-status');
        if (status) status.innerText = 'Menyiapkan modul aplikasi...';
      }, 3500);

      function clearAppDataAndReload() {
        try {
          if ('caches' in window) {
            caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k))));
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
              for (const r of regs) r.unregister();
            });
          }
          sessionStorage.clear();
        } catch (e) {}
        window.location.reload(true);
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => {
              reg.update();
            })
            .catch(err => console.warn('Service Worker registration notice:', err));
        });
      }
    </script>
  </body>
</html>
