<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sie Penganugerahan - Portal Panitia & Operasional</title>

    <!-- PWA Primary Meta Tags -->
    <meta name="title" content="Sie Penganugerahan" />
    <meta name="description" content="Aplikasi Operasional Sie Penganugerahan: Pengelolaan Nominasi, Administrasi Kegiatan, Koordinasi Panitia, dan Laporan Keuangan." />
    <meta name="theme-color" content="#8a7c4c" />

    <!-- Google Fonts: Sora (Milad Sidogiri Typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Web App Manifest & Favicons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo-milad.png" />
    <link rel="alternate icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo-milad.png" />

    <!-- iOS & Mobile Web App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sie Penganugerahan" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => {
              // Check for update immediately
              reg.update();
            })
            .catch(err => console.warn('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
